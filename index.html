<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RNG Crypto Trading Bot Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="app-header">
        <div class="logo-area">
            <span class="pulse-icon"></span>
            <h1>RNG TradeBot <span class="badge">v2.0</span></h1>
        </div>
        <div class="balance-display">
            <span class="label">Sim Balance:</span>
            <span id="account-balance" class="amount">$10,000.00</span>
        </div>
    </header>

    <!-- Main Workspace Dashboard -->
    <main class="dashboard-container">
        
        <!-- Tab 1: Chart View -->
        <section id="chart-tab" class="tab-content active">
            <div class="card chart-card">
                <div class="chart-header">
                    <span class="pair-title">BTC / USDT <span class="live-tag">LIVE SIM</span></span>
                    <span id="current-price" class="price-ticker">$96,450.00</span>
                </div>
                <div class="canvas-container">
                    <canvas id="tradingChart"></canvas>
                </div>
            </div>
            
            <!-- Quick Execution Module for Mobile Chart View -->
            <div class="quick-trade-actions">
                <button id="mobile-buy-btn" class="action-btn buy">Instant Buy</button>
                <button id="mobile-sell-btn" class="action-btn sell">Instant Sell</button>
            </div>
        </section>

        <!-- Tab 2: Order Book & Logs -->
        <section id="book-tab" class="tab-content">
            <div class="card order-book-card">
                <h3>Live Order Book</h3>
                <div class="order-book-grid">
                    <div class="book-side asks">
                        <h4>Asks (Sells)</h4>
                        <ul id="asks-list"></ul>
                    </div>
                    <div class="book-side bids">
                        <h4>Bids (Buys)</h4>
                        <ul id="bids-list"></ul>
                    </div>
                </div>
            </div>
            
            <div class="card log-card">
                <h3>Historical Trade Ledger</h3>
                <div class="table-wrapper">
                    <table id="trade-log-table">
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Price</th>
                                <th>Result</th>
                                <th>PnL</th>
                            </tr>
                        </thead>
                        <tbody id="log-body">
                            <!-- Logs injected here dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Tab 3: Bot Control Panel / Settings -->
        <section id="settings-tab" class="tab-content">
            <div class="card settings-card">
                <h3>Bot Configuration Matrix</h3>
                
                <div class="control-group">
                    <label>Order Execution Engine</label>
                    <div class="toggle-buttons">
                        <button id="market-mode" class="toggle-btn active">Market Order</button>
                        <button id="limit-mode" class="toggle-btn">Limit Order</button>
                    </div>
                </div>

                <div class="control-group">
                    <div class="slider-header">
                        <label for="win-chance">RNG Win Probability</label>
                        <span id="win-chance-val">50%</span>
                    </div>
                    <input type="range" id="win-chance" min="1" max="100" value="50">
                </div>

                <div class="control-group">
                    <div class="slider-header">
                        <label for="rr-ratio">Risk-to-Reward Ratio (R:R)</label>
                        <span id="rr-ratio-val">1:2</span>
                    </div>
                    <input type="range" id="rr-ratio" min="1" max="5" step="0.5" value="2">
                </div>

                <div class="control-group">
                    <div class="slider-header">
                        <label for="leverage">Margin Leverage Power</label>
                        <span id="leverage-val">1x</span>
                    </div>
                    <input type="range" id="leverage" min="1" max="20" value="1">
                </div>
            </div>
        </section>

    </main>

    <!-- Mobile Navigation Bar (Hidden on Desktop) -->
    <nav class="mobile-nav-bar">
        <button class="nav-item active" data-target="chart-tab">
            <span class="icon">📊</span>
            <span class="label">Chart</span>
        </button>
        <button class="nav-item" data-target="book-tab">
            <span class="icon">📋</span>
            <span class="label">Data</span>
        </button>
        <button class="nav-item" data-target="settings-tab">
            <span class="icon">⚙️</span>
            <span class="label">Settings</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
